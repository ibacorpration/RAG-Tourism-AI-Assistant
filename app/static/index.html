<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat · Document Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0f1e;
      display: flex;
      flex-direction: column;
      color: #f0f4ff;
      overflow: hidden;
      position: relative;
      cursor: default;
    }

    #starfieldCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      pointer-events: none;
    }

    .glow-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(175, 1, 255, 0.15) 0%, rgba(0, 0, 0, 0.5) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      backdrop-filter: blur(1px);
    }

    .app-header {
      padding: 1rem 3rem;
      background: rgba(10, 15, 30, 0.4);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 1.7rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #0a0f1e;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, #f0f4ff, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .brand-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      -webkit-text-fill-color: #94a3b8;
      background: none;
      font-weight: 400;
      margin-left: 0.4rem;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      background: rgba(34, 211, 238, 0.06);
      border: 1px solid rgba(34, 211, 238, 0.12);
      font-size: 0.75rem;
      color: #22d3ee;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22d3ee;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        transform: scale(0.7);
      }
    }

    .main-layout {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 4rem;
      min-height: 0;
      height: calc(100vh - 80px);
      gap: 2rem;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 1.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      font-weight: 600;
    }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .quick-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      color: #cbd5e1;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .quick-btn:hover {
      background: rgba(59, 130, 246, 0.06);
      border-color: rgba(59, 130, 246, 0.2);
      color: #f0f4ff;
      transform: translateX(4px);
    }

    .quick-btn .icon {
      font-size: 1rem;
    }

    .stats-box {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 1rem;
      margin-top: auto;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      font-size: 0.8rem;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    .stat-value {
      color: #e2e8f0;
      font-weight: 500;
    }

    .stat-value.highlight {
      color: #60a5fa;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.08);
      padding: 0 0.4rem;
      border-radius: 6px;
    }

    .stat-value.stale {
      color: #f87171;
    }

    .clear-btn {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.1);
      color: #f87171;
      padding: 0.5rem;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 0.5rem;
    }

    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.12);
    }

    .chat-panel {
      flex: 1;
      max-width: 800px;
      height: 100%;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem 1.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    .message {
      max-width: 78%;
      padding: 0.8rem 1.3rem;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.6;
      animation: slideUp 0.3s ease;
      position: relative;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
    }

    .message.bot {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      border-bottom-right-radius: 6px;
    }

    .message .time {
      font-size: 0.6rem;
      color: #94a3b8;
      margin-top: 0.3rem;
      opacity: 0.6;
    }

    .message p {
      margin: 0 0 0.5rem 0;
    }

    .message p:last-of-type {
      margin-bottom: 0;
    }

    .message ul,
    .message ol {
      margin: 0.3rem 0 0.6rem 1.1rem;
      padding: 0;
    }

    .message li {
      margin-bottom: 0.25rem;
    }

    .message strong {
      color: #93bbfc;
      font-weight: 700;
    }

    .message.user strong {
      color: #fff;
    }

    .message.user .time {
      color: rgba(255, 255, 255, 0.5);
    }

    .sources-box {
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.7rem;
    }

    .source-tag {
      display: inline-block;
      background: rgba(59, 130, 246, 0.08);
      color: #93bbfc;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      margin-top: 0.15rem;
      margin-right: 0.25rem;
      border: 1px solid rgba(59, 130, 246, 0.08);
      font-size: 0.65rem;
    }

    .chat-input-area {
      padding: 1.2rem 1.8rem 1.5rem;
      background: rgba(10, 15, 30, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 0.8rem 1.3rem;
      color: #f0f4ff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s;
    }

    .chat-input::placeholder {
      color: #64748b;
    }

    .chat-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.06);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-send {
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(59, 130, 246, 0.15);
    }

    .btn-send:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 32px rgba(59, 130, 246, 0.2);
    }

    .btn-send:active {
      transform: scale(0.97);
    }

    @media (max-width: 1024px) {
      .main-layout {
        padding: 1.5rem 2rem;
      }
    }

    @media (max-width: 820px) {
      .main-layout {
        flex-direction: column;
        padding: 1rem;
        height: auto;
        justify-content: flex-start;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 1rem;
        gap: 0.8rem;
      }

      .sidebar .quick-actions {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .sidebar .quick-btn {
        font-size: 0.75rem;
        padding: 0.4rem 0.7rem;
      }

      .stats-box {
        display: none;
      }

      .chat-panel {
        height: 65vh;
        min-height: 400px;
        max-width: 100%;
        width: 100%;
      }

      .message {
        max-width: 90%;
        font-size: 0.85rem;
        padding: 0.6rem 1rem;
      }

      .chat-input-area {
        padding: 0.8rem 1rem;
        flex-wrap: wrap;
      }

      .btn-send {
        padding: 0.6rem 1.2rem;
        font-size: 0.8rem;
      }

      .app-header {
        padding: 0.7rem 1rem;
      }

      .brand-sub {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .chat-input {
        font-size: 0.8rem;
        padding: 0.6rem 1rem;
      }

      .message {
        max-width: 95%;
        font-size: 0.8rem;
      }

      .main-layout {
        padding: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <canvas id="starfieldCanvas"></canvas>
  <div class="glow-overlay"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <div class="avatar">🤖</div>
        <div><span class="brand">RAG Chatbot</span></div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>live</span>
      </div>
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <div>
          <div class="sidebar-title">quick prompts</div>
          <div class="quick-actions">
            <button class="quick-btn" onclick="quickQuestion('Overview Tourism AI Assistant ?')"><span
                class="icon">🧠</span> Overview Tourism AI Assistant ?</button>
            <button class="quick-btn" onclick="quickQuestion(' Company Profile ?')"><span class="icon">⚡</span>
              Company Profile ?</button>
            <button class="quick-btn" onclick="quickQuestion(' Branch Network ?')"><span class="icon">🚀</span> Branch
              Network ?</button>
            <button class="quick-btn" onclick="quickQuestion('Core Values?')"><span class="icon">📐</span>
              Core Values ?</button>
          </div>
        </div>

        <div class="stats-box">
          <div class="sidebar-title" style="margin-bottom: 0.4rem;">📊 system</div>
          <div class="stat-item"><span>📁 documents</span><span class="stat-value highlight" id="statDocs">—</span>
          </div>
          <div class="stat-item"><span>🧩 chunks</span><span class="stat-value" id="statChunks">—</span></div>
          <div class="stat-item"><span>🧠 model</span><span class="stat-value"
              style="font-size:0.7rem;">all-MiniLM-L6-v2</span></div>
          <button class="clear-btn" onclick="clearHistory()">🗑️ clear chat</button>
        </div>
      </aside>

      <main class="chat-panel">
        <div class="chat-messages" id="chatMessages">
          <div class="message bot">
            🤖 Hello, I'm your RAG assistant.<br>Ask me anything – I'll respond based on indexed knowledge.
            <div class="time">now</div>
          </div>
        </div>

        <div class="chat-input-area">
          <input type="text" id="userInput" class="chat-input" placeholder="Ask a question..."
            onkeypress="handleKeyPress(event)">
          <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    // ============================================================
    // STARFIELD WITH CONNECTIONS (same as original)
    // ============================================================
    (function () {
      const canvas = document.getElementById('starfieldCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let stars = [];
      const NUM_STARS = 280;
      let mouseX = -9999, mouseY = -9999;
      let targetMouseX = -9999, targetMouseY = -9999;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      class Star {
        constructor() { this.reset(true); }
        reset(init = false) {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 2.0 + 0.8;
          this.speed = 0.25 + Math.random() * 0.4;
          this.angle = Math.random() * Math.PI * 2;
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;
          this.twinkleSpeed = 0.02 + Math.random() * 0.04;
          this.twinklePhase = Math.random() * Math.PI * 2;
          this.baseOpacity = 0.6 + Math.random() * 0.4;
          this.attraction = 0.018 + Math.random() * 0.035;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < -10) this.x = width + 10;
          if (this.x > width + 10) this.x = -10;
          if (this.y < -10) this.y = height + 10;
          if (this.y > height + 10) this.y = -10;
          if (mouseX > 0 && mouseY > 0 && mouseX < width && mouseY < height) {
            const dx = mouseX - this.x, dy = mouseY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 280) {
              const force = (1 - dist / 280) * this.attraction * 1.3;
              this.vx += dx * force * 0.018;
              this.vy += dy * force * 0.018;
              const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
              const maxSpd = 2.8;
              if (spd > maxSpd) { this.vx = (this.vx / spd) * maxSpd; this.vy = (this.vy / spd) * maxSpd; }
            }
          }
          const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (currentSpeed > 0.1) { this.vx *= 0.999; this.vy *= 0.999; } else {
            this.vx += (Math.random() - 0.5) * 0.015;
            this.vy += (Math.random() - 0.5) * 0.015;
          }
        }
        draw() {
          const opacity = this.baseOpacity * (0.7 + 0.3 * Math.sin(this.twinklePhase));
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
          ctx.fill();
          if (this.size > 1.6) {
            ctx.shadowColor = 'rgba(150, 180, 255, 0.2)';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
          this.twinklePhase += this.twinkleSpeed;
        }
      }

      for (let i = 0; i < NUM_STARS; i++) stars.push(new Star());

      document.addEventListener('mousemove', (e) => { targetMouseX = e.clientX; targetMouseY = e.clientY; });
      document.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        if (touch) { targetMouseX = touch.clientX; targetMouseY = touch.clientY; }
      }, { passive: true });

      function drawConnections() {
        const connectionDist = 140;
        for (let i = 0; i < stars.length; i++) {
          let connections = 0;
          for (let j = i + 1; j < stars.length; j++) {
            if (connections >= 3) break;
            const dx = stars[i].x - stars[j].x;
            const dy = stars[i].y - stars[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < connectionDist) {
              const alpha = (1 - dist / connectionDist) * 0.25;
              ctx.beginPath();
              ctx.moveTo(stars[i].x, stars[i].y);
              ctx.lineTo(stars[j].x, stars[j].y);
              ctx.strokeStyle = `rgba(180, 200, 255, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
              connections++;
            }
          }
        }
      }

      function animate() {
        mouseX += (targetMouseX - mouseX) * 0.08;
        mouseY += (targetMouseY - mouseY) * 0.08;
        ctx.clearRect(0, 0, width, height);
        for (let star of stars) star.update();
        drawConnections();
        for (let star of stars) star.draw();
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ============================================================
    // CHAT LOGIC + REAL, AUTO-REFRESHING DOCUMENT COUNTER
    // ============================================================
    let conversationId = 'session-' + Math.random().toString(36).substring(2, 9);
    let isProcessing = false;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    // Safety net: even with a strict prompt, an LLM occasionally forgets
    // the blank line before a new bold "**Category:**" heading and glues
    // it onto the end of the previous line/item. Force every such heading
    // onto its own paragraph before handing the text to the Markdown
    // renderer, so categorized answers (from ANY document, not just one
    // file type) always render as separate sections instead of merging.
    function normalizeMarkdown(text) {
      return text.replace(/[ \t]*\n?[ \t]*\*\*([^*\n]+:)\*\*/g, '\n\n**$1**').trim();
    }

    function appendMessage(role, text, timestamp = new Date()) {
      const messagesDiv = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + role;
      const timeStr = timestamp.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      // User text is always plain (escaped); bot placeholder text ("thinking...")
      // is also plain here — the real bot answer gets Markdown-rendered
      // separately once it arrives, see sendMessage().
      const safeText = role === 'user' ? escapeHtml(text) : text;
      msgDiv.innerHTML = safeText + `<div class="time">${timeStr}</div>`;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return msgDiv;
    }

    // ---------- REAL document/chunk counts from /api/v1/embeddings/stats ----------
    // The backend keeps this collection in sync with whatever is physically
    // sitting in data/uploads (files added or removed are picked up
    // automatically), so polling this endpoint is enough to reflect reality —
    // no fake/demo numbers here.
    async function loadStats() {
      const docsEl = document.getElementById('statDocs');
      const chunksEl = document.getElementById('statChunks');
      try {
        const res = await fetch('/api/v1/embeddings/stats');
        if (!res.ok) throw new Error(`stats request failed: ${res.status}`);
        const data = await res.json();

        docsEl.innerText = data.total_documents ?? 0;
        chunksEl.innerText = data.total_vectors ?? 0;
        docsEl.classList.remove('stale');
        chunksEl.classList.remove('stale');
      } catch (e) {
        // Don't invent numbers on failure — just flag that what's shown
        // might be out of date, and keep the last known real values.
        docsEl.classList.add('stale');
        chunksEl.classList.add('stale');
        console.error('Failed to load collection stats:', e);
      }
    }

    async function sendMessage() {
      if (isProcessing) return;
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      isProcessing = true;
      appendMessage('user', text);
      input.value = '';

      const botMsgDiv = appendMessage('bot', ' thinking...');

      try {
        const res = await fetch('/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, conversation_id: conversationId })
        });
        const data = await res.json();
        if (res.ok) {
          // Render the answer as Markdown so bullet lists, bold category
          // labels, etc. from the LLM actually show up as a list instead
          // of being flattened into one run-on paragraph.
          const renderedAnswer = (typeof marked !== 'undefined')
            ? marked.parse(normalizeMarkdown(data.response))
            : escapeHtml(data.response).replace(/\n/g, '<br>');
          botMsgDiv.innerHTML = renderedAnswer + `<div class="time">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>`;
          if (data.sources && data.sources.length) {
            const box = document.createElement('div');
            box.className = 'sources-box';
            box.innerHTML = '<strong>📎 sources:</strong><br>';
            // One tag per distinct file that actually backed this answer —
            // no chunk repeats, no percentages, just the file name(s).
            const seenFiles = new Set();
            data.sources.forEach(s => {
              const name = s.metadata?.source || 'doc';
              if (seenFiles.has(name)) return;
              seenFiles.add(name);
              const tag = document.createElement('span');
              tag.className = 'source-tag';
              tag.innerText = name;
              box.appendChild(tag);
            });
            botMsgDiv.appendChild(box);
          }
        } else {
          const icon = res.status === 429 ? '⏳' : '❌';
          botMsgDiv.innerHTML = `${icon} ` + escapeHtml(data.detail || 'try again') + `<div class="time">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>`;
        }
      } catch (e) {
        botMsgDiv.innerHTML = '❌ connection error, please try again.' + `<div class="time">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>`;
        console.error('Chat request failed:', e);
      }
      isProcessing = false;
      document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    }

    function quickQuestion(q) {
      document.getElementById('userInput').value = q;
      sendMessage();
    }

    async function clearHistory() {
      try { await fetch(`/api/v1/chat/history/${conversationId}`, { method: 'DELETE' }); } catch { }
      document.getElementById('chatMessages').innerHTML = `
        <div class="message bot">
          🗑️ Chat cleared. How can I help?
          <div class="time">${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
        </div>
      `;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // On load: fetch the real document/chunk counts, then keep refreshing
    // them regularly so additions/removals in data/uploads show up here
    // automatically without a page reload.
    window.onload = function () {
      loadStats();
      setInterval(loadStats, 5000);
    };
  </script>
</body>

</html>
